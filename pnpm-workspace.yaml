# The skeleton is a workspace even for a single package. A new lone package is
# born as a workspace of one: nothing to delete now, no migration the day a
# second package appears.
packages:
  - 'packages/*'

# pnpm's supply-chain policy, pinned rather than inherited, and exempting the
# packages published from these repos. This block is contract item 10: the
# README carries the reasoning, including why the strictness flag is written out
# when it looks redundant and why the two unscoped names are not. Keep it there
# rather than restating it here — this file is scaffolding and drifts, the
# contract does not.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@jperezmart/*'
  - ts-devtools-plugin-radix-themes
  - tw-preset-radix
